        id: { type: integer }
        type: { type: string, enum: [income, expense] }
        category: { type: string }
        description: { type: string }
        amount: { type: number }
        date: { type: string }
        bankTransactionId: { type: ["integer", "null"] }
        bankVerifiedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string }
        editable: { type: boolean }
        transactionKind: { type: string, enum: [manual, payroll, payroll_advance, inventory_purchase, fixed_asset_purchase, bank_transaction] }
        score: { type: number }
    CashTransactionInput:
      type: object
      required: [type, category, description, amount, date, incomeMonth]
