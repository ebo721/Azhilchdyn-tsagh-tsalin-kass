        counterparty: { type: string }
        description: { type: string }
        executedAt: { type: ["string", "null"], format: date-time }
        balance: { type: ["number", "null"] }
        transferredAt: { type: ["string", "null"], format: date-time }
        cashTransactionId: { type: ["integer", "null"] }
        bankAccountId: { type: ["integer", "null"] }
        bankName: { type: ["string", "null"] }
        bankAccountNumber: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    BankTransactionAccountInput:
      type: object
      required: [accountId]
      properties:
        accountId: { type: ["integer", "null"], minimum: 1 }
    BankTransactionJournalReviewItem:
      type: object
      required: [id, date, transactionAt, type, description, amount, counterparty, suggestedAccountId, suggestedAccountName]
      properties:
        id: { type: integer }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        transactionAt: { type: string, format: date-time }
        type: { type: string, enum: [income, expense] }
        description: { type: string }
        amount: { type: number }
        counterparty: { type: string }
        suggestedAccountId: { type: ["integer", "null"] }
        suggestedAccountName: { type: ["string", "null"] }
        existingPurchaseMatch:
          $ref: "#/components/schemas/BankTransactionPurchaseMatch"
    BankTransactionPurchaseMatch:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [inventory_purchase, operating_expense] }
        id: { type: integer, minimum: 1 }
    ExistingInventoryPurchaseLink:
      type: object
      required: [inventoryPurchaseId]
      properties:
        inventoryPurchaseId: { type: integer, minimum: 1 }
    BankPurchaseLinkInput:
      anyOf:
        - $ref: "#/components/schemas/ExistingInventoryPurchaseLink"
        - $ref: "#/components/schemas/InventoryPurchaseInput"
    BankPurchaseLinkResult:
      type: object
      required: [bankTransactionId, inventoryPurchaseId, cashTransactionId, journalEntryId]
      properties:
        bankTransactionId: { type: integer, minimum: 1 }
        inventoryPurchaseId: { type: integer, minimum: 1 }
        cashTransactionId: { type: integer, minimum: 1 }
        journalEntryId: { type: integer, minimum: 1 }
    ExistingOperatingExpenseLink:
      type: object
      required: [operatingExpenseId]
      properties:
        operatingExpenseId: { type: integer, minimum: 1 }
    BankExpenseLinkInput:
      anyOf:
        - $ref: "#/components/schemas/ExistingOperatingExpenseLink"
        - $ref: "#/components/schemas/OperatingExpenseInput"
    BankExpenseLinkResult:
      type: object
      required: [bankTransactionId, operatingExpenseId, cashTransactionId, journalEntryId]
      properties:
        bankTransactionId: { type: integer, minimum: 1 }
        operatingExpenseId: { type: integer, minimum: 1 }
        cashTransactionId: { type: integer, minimum: 1 }
        journalEntryId: { type: integer, minimum: 1 }
    ExistingFixedAssetLink:
      type: object
      required: [fixedAssetId]
      properties:
        fixedAssetId: { type: integer, minimum: 1 }
    NewFixedAssetBankPurchaseInput:
      type: object
      required: [name, unitPrice, quantity, date]
      properties:
        name: { type: string, minLength: 1 }
        unitPrice: { type: number, exclusiveMinimum: 0 }
        quantity: { type: integer, minimum: 1 }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
    BankFixedAssetLinkInput:
      anyOf:
        - $ref: "#/components/schemas/ExistingFixedAssetLink"
        - $ref: "#/components/schemas/NewFixedAssetBankPurchaseInput"
    BankFixedAssetLinkResult:
      type: object
      required: [bankTransactionId, fixedAssetId, cashTransactionId, journalEntryId]
      properties:
        bankTransactionId: { type: integer, minimum: 1 }
        fixedAssetId: { type: integer, minimum: 1 }
        cashTransactionId: { type: integer, minimum: 1 }
        journalEntryId: { type: integer, minimum: 1 }
    BankTransactionJournalPostInput:
      type: object
      required: [accountId]
      properties:
        accountId: { type: integer, minimum: 1 }
    BankTransactionJournalPostResult:
      type: object
      required: [id, journalEntryId]
      properties:
        id: { type: integer }
        journalEntryId: { type: integer }
    BankTransactionJournalDeleteResult:
      type: object
      required: [bankTransactionId, voidedJournalEntryId, reversalJournalEntryId]
      properties:
        bankTransactionId: { type: integer, minimum: 1 }
        voidedJournalEntryId: { type: integer, minimum: 1 }
        reversalJournalEntryId: { type: integer, minimum: 1 }
    BankTransactionImportResult:
      type: object
      required: [imported, skippedDuplicate, skippedZero, totalRead, recognized, unrecognized, transactionIds]
      properties:
        imported: { type: integer, minimum: 0 }
        skippedDuplicate: { type: integer, minimum: 0 }
        skippedZero: { type: integer, minimum: 0 }
        totalRead: { type: integer, minimum: 0 }
        recognized: { type: integer, minimum: 0 }
        unrecognized: { type: integer, minimum: 0 }
        transactionIds:
          type: array
          items: { type: integer, minimum: 1 }
    InventoryPurchaseItem:
      type: object
      required: [id, inventoryItemId, name, category, unit, quantity, unitPrice, totalAmount]
      properties:
        id: { type: integer }
        inventoryItemId: { type: integer }
        name: { type: string }
        category: { type: string }
        unit: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        totalAmount: { type: number }
    InventoryPurchase:
      type: object
      required: [id, materialType, accountId, accountCode, accountName, supplierName, hasReceipt, date, totalAmount, paid, createdAt, editable, items]
      properties:
        id: { type: integer }
        materialType:
          type: string
          enum: [food, supply]
        accountId: { type: integer, nullable: true }
        accountCode: { type: string, nullable: true }
        accountName: { type: string, nullable: true }
        supplierName: { type: string }
        hasReceipt: { type: boolean }
        date: { type: string }
        totalAmount: { type: number }
        paid: { type: boolean }
        paymentDate: { type: string, nullable: true }
        paymentAmount: { type: number, nullable: true }
        createdAt: { type: string }
        editable: { type: boolean }
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryPurchaseItem"
    InventoryPurchaseItemInput:
      type: object
      required: [name, category, unit, quantity, unitPrice]
      properties:
        inventoryItemId: { type: integer }
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        unit:
          type: string
          enum: [ширхэг, кг, грамм, литр, мл, метр, багц, хайрцаг]
        quantity: { type: number, exclusiveMinimum: 0 }
        unitPrice: { type: number, minimum: 0 }
    InventoryPurchaseInput:
      type: object
      required: [materialType, supplierName, hasReceipt, date, items]
      properties:
        materialType:
          type: string
          enum: [food, supply]
        supplierName: { type: string, minLength: 1 }
        hasReceipt: { type: boolean }
        date:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InventoryPurchaseItemInput"
    InventoryPurchasePaymentInput:
      type: object
      required: [date, amount]
      properties:
        date:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
        amount: { type: number, exclusiveMinimum: 0 }
        bankTransactionId: { type: ["integer", "null"] }
    InventoryPurchaseBankSuggestion:
      type: object
      required: [id, transactionAt, amount, description, score]
      properties:
        id: { type: integer }
        transactionAt: { type: string, format: date-time }
        amount: { type: number }
        description: { type: string }
        score: { type: number }
    ReclassifyInventoryPurchaseAsExpenseInput:
      type: object
      required: [accountId]
      properties:
        accountId: { type: integer, minimum: 1 }
    InventorySupplierUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    InventorySupplierItem:
      type: object
      required: [name, unit, quantity, totalAmount]
      properties:
        name: { type: string }
        unit: { type: string }
        quantity: { type: number }
        totalAmount: { type: number }
    InventorySupplier:
      type: object
      required: [id, name, purchaseCount, totalAmount, unpaidAmount, items]
      properties:
        id: { type: integer }
        name: { type: string }
        purchaseCount: { type: integer }
        totalAmount: { type: number }
        unpaidAmount: { type: number, description: "totalAmount minus what has actually been paid across this supplier's purchases" }
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventorySupplierItem"
    InventoryItem:
      type: object
      required: [id, materialType, name, category, unit, quantity, totalValue, createdAt]
      properties:
        id: { type: integer }
        materialType:
          type: string
          enum: [food, supply]
        name: { type: string }
        category: { type: string }
        unit: { type: string }
        quantity: { type: number }
        totalValue: { type: number, description: "FIFO value of remaining stock (sum of unconsumed purchase lots at their original unit price)" }
        createdAt: { type: string }
    InventoryItemUpdate:
      type: object
      required: [name, category]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
    InventoryIssue:
      type: object
      required: [id, inventoryItemId, itemName, unit, date, quantity, totalCost, purpose, createdAt]
      properties:
        id: { type: integer }
        inventoryItemId: { type: integer }
        itemName: { type: string }
        unit: { type: string }
        date: { type: string }
        quantity: { type: number }
        totalCost: { type: number, description: "FIFO cost of the stock consumed by this issue" }
        purpose: { type: string }
        createdAt: { type: string }
    InventoryIssueInput:
      type: object
      required: [inventoryItemId, date, quantity, purpose]
      properties:
        inventoryItemId: { type: integer }
        date:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
        quantity: { type: number, exclusiveMinimum: 0 }
        purpose: { type: string, minLength: 1 }
    OperatingExpense:
      type: object
      required: [id, description, category, accountId, date, amount, paymentDate, paymentAmount, bankTransactionId, cashTransactionId, createdAt]
      properties:
        id: { type: integer }
        description: { type: string }
        category: { type: string }
        accountId: { type: integer }
        date: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$' }
        amount: { type: number, minimum: 0 }
        paymentDate: { type: ["string", "null"] }
        paymentAmount: { type: ["number", "null"] }
        bankTransactionId: { type: ["integer", "null"] }
        cashTransactionId: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
    OperatingExpenseInput:
      type: object
      required: [description, accountId, date, amount]
      properties:
        description: { type: string, minLength: 1 }
        accountId: { type: integer, minimum: 1 }
        date: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$' }
        amount: { type: number, exclusiveMinimum: 0 }
    OperatingExpensePaymentInput:
      type: object
      required: [date, amount]
      properties:
        date: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$' }
        amount: { type: number, exclusiveMinimum: 0 }
        bankTransactionId: { type: integer, minimum: 1 }
    OperatingExpenseBankSuggestion:
      type: object
      required: [id, transactionAt, amount, description, score]
      properties:
        id: { type: integer }
        transactionAt: { type: string, format: date-time }
        amount: { type: number }
        description: { type: string }
        score: { type: number }
    FixedAsset:
      type: object
      required: [id, name, unitPrice, quantity, totalAmount, date, purchased, bankTransactionId, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
        totalAmount: { type: number }
        date: { type: string }
        purchased: { type: boolean }
        bankTransactionId: { type: ["integer", "null"], minimum: 1 }
        createdAt: { type: string }
    FixedAssetInput:
      type: object
      required: [name, unitPrice, quantity, date, purchased]
      properties:
        name: { type: string, minLength: 1 }
        unitPrice: { type: number, exclusiveMinimum: 0 }
        quantity: { type: integer, minimum: 1 }
        date:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
        purchased: { type: boolean }
    DeletionRequest:
      type: object
      required: [id, targetPath, label, requesterRole, status, requestedAt]
      properties:
        id: { type: integer }
        targetPath: { type: string }
        label: { type: string }
        requesterRole: { type: string, enum: [admin, hr, accountant, warehouse] }
        status: { type: string, enum: [pending, executing, completed, failed, cancelled] }
        requestedAt: { type: string }
        approvedAt: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
    DeletionRequestInput:
      type: object
      required: [targetPath, label]
      properties:
        targetPath: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }

