openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: auth
    description: HR manager authentication
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summaries
  - name: employees
    description: Employee management
  - name: attendance
    description: Attendance tracking
  - name: payroll
    description: Payroll calculations
  - name: hour-balance
    description: Monthly hour balances
  - name: cash
    description: Cash register transactions
  - name: bank-transactions
    description: Bank statement transactions
  - name: users
    description: Admin user management
  - name: chart-of-accounts
    description: Accounting chart management
  - name: journal
    description: General journal and accounting reports
paths:
  /auth/me:
    get:
      operationId: getAuthSession
      tags: [auth]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/login:
    post:
      operationId: loginHrManager
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/logout:
    post:
      operationId: logoutHrManager
      tags: [auth]
      responses:
        "204":
          description: Logged out
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (admin only)
      responses:
        "200":
          description: Users without password data
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
  /users/{id}:
    put:
      operationId: updateUser
      tags: [users]
      summary: Update username, role, or password (admin only)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdateInput" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin only)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: User deleted
  /chart-of-accounts:
    get:
      operationId: listChartOfAccounts
      tags: [chart-of-accounts]
      summary: List the chart of accounts for authenticated users
      responses:
        "200":
          description: Chart of accounts ordered by code
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChartOfAccount" }
    post:
      operationId: createChartOfAccount
      tags: [chart-of-accounts]
      summary: Create a chart of account entry (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChartOfAccountInput" }
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChartOfAccount" }
  /chart-of-accounts/{id}:
    put:
      operationId: updateChartOfAccount
      tags: [chart-of-accounts]
      summary: Update a chart of account entry (admin only)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChartOfAccountInput" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChartOfAccount" }
    delete:
      operationId: deleteChartOfAccount
      tags: [chart-of-accounts]
      summary: Delete a chart of account entry (admin only)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Account deleted
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
  /employees/{id}:
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete an employee
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Employee deleted
  /employees/{id}/salary-history:
    get:
      operationId: listEmployeeSalaryHistory
      tags: [employees]
      summary: List an employee's salary history
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Salary history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeSalaryHistory"
  /employees/{id}/salary-history/{historyId}:
    patch:
      operationId: updateEmployeeSalaryHistory
      tags: [employees]
      summary: Correct a salary history entry
      parameters:
        - $ref: "#/components/parameters/Id"
        - in: path
          name: historyId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeSalaryHistoryUpdate"
      responses:
        "200":
          description: Updated salary history entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeSalaryHistory"
    delete:
      operationId: deleteEmployeeSalaryHistory
      tags: [employees]
      summary: Delete an incorrect salary history entry
      parameters:
        - $ref: "#/components/parameters/Id"
        - in: path
          name: historyId
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Salary history entry deleted
  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List attendance records
      parameters:
        - in: query
          name: date
          schema:
            type: string
          required: false
        - in: query
          name: month
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          required: false
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attendance"
    post:
      operationId: createAttendance
      tags: [attendance]
      summary: Create or replace attendance record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: Created attendance record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
        "409":
          $ref: "#/components/responses/Conflict"
    put:
      operationId: upsertAttendance
      tags: [attendance]
      summary: Mark an employee as present or absent for a day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceToggleInput"
      responses:
        "200":
          description: Updated attendance record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteAttendance
      tags: [attendance]
      summary: Clear an employee attendance record for a day
      parameters:
        - in: query
          name: employeeId
          required: true
          schema:
            type: integer
        - in: query
          name: date
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Attendance record cleared
        "409":
          $ref: "#/components/responses/Conflict"
  /attendance/shifts:
    get:
      operationId: listShifts
      tags: [attendance]
      summary: List reusable shift schedules
      responses:
        "200":
          description: Shift schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shift"
    post:
      operationId: createShift
      tags: [attendance]
      summary: Create a shift schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftInput"
      responses:
        "201":
          description: Created shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
  /attendance/shifts/{id}:
    patch:
      operationId: updateShift
      tags: [attendance]
      summary: Update a shift schedule
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftInput"
      responses:
        "200":
          description: Updated shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
    delete:
      operationId: deleteShift
      tags: [attendance]
      summary: Delete an unused shift schedule
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Shift deleted
  /attendance/shift-plans:
    get:
      operationId: listShiftPlans
      tags: [attendance]
      summary: List employee shift plans for a month
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        "200":
          description: Monthly shift plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShiftPlan"
    put:
      operationId: upsertShiftPlan
      tags: [attendance]
      summary: Assign or clear an employee shift for a day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftPlanInput"
      responses:
        "200":
          description: Updated shift plan, or null when cleared
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ShiftPlan"
                  - type: "null"
  /attendance/shift-plans/copy-previous:
    post:
      operationId: copyPreviousShiftPlans
      tags: [attendance]
      summary: Copy valid active shift-employee plans from a selected month
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftPlanCopyInput"
      responses:
        "200":
          description: Shift plan copy result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftPlanCopyResult"
  /attendance/office-network:
    get:
      operationId: getOfficeAttendanceNetwork
      tags: [attendance]
      summary: Get the configured office public IP (admin or HR)
      responses:
        "200":
          description: Configured office network
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfficeNetwork" }
    put:
      operationId: setOfficeAttendanceNetwork
      tags: [attendance]
      summary: Set the office public IP (admin or HR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfficeNetworkInput" }
      responses:
        "200":
          description: Updated office network
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfficeNetwork" }
  /attendance/office-pending:
    get:
      operationId: listOfficeAttendancePendingPunches
      tags: [attendance]
      summary: List active phone check-ins awaiting checkout (admin or HR)
      responses:
        "200":
          description: Pending phone punches; cancelled and completed punches are excluded
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OfficeAttendancePendingPunch" }
  /attendance/office-pending/{id}/cancel:
    post:
      operationId: cancelOfficeAttendancePendingPunch
      tags: [attendance]
      summary: Record cancellation of a pending phone punch (admin or HR)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfficeAttendancePunchCancellationInput" }
      responses:
        "200":
          description: Durable cancellation marker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfficeAttendancePunchCancellation" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /attendance/device-enrollments:
    get:
      operationId: listAttendanceDeviceEnrollments
      tags: [attendance]
      summary: List enrollment token metadata (admin or HR)
      responses:
        "200":
          description: Enrollment token metadata; token values are never returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AttendanceDeviceEnrollment" }
    post:
      operationId: createAttendanceDeviceEnrollment
      tags: [attendance]
      summary: Issue a single-use enrollment token for an active employee (admin or HR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceDeviceEnrollmentInput" }
      responses:
        "201":
          description: Enrollment token, shown only once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceDeviceEnrollmentIssued" }
  /attendance/devices:
    get:
      operationId: listAttendanceDevices
      tags: [attendance]
      summary: List registered attendance devices (admin or HR)
      responses:
        "200":
          description: Registered devices without public-key material
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AttendanceDevice" }
  /attendance/devices/{id}:
    delete:
      operationId: revokeAttendanceDevice
      tags: [attendance]
      summary: Revoke an attendance device (admin or HR)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Device revoked
  /attendance/device/register:
    post:
      operationId: registerAttendanceDevice
      tags: [attendance]
      summary: Redeem an enrollment token and register a browser public key from the office network
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceDeviceRegistrationInput" }
      responses:
        "201":
          description: Registered device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceDeviceRegistration" }
        "403":
          description: Request did not originate from the configured office network
  /attendance/device/status:
    post:
      operationId: getAttendanceDeviceStatus
      tags: [attendance]
      summary: Get this registered device's signed attendance status from the office network
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceDeviceSignedRequest" }
      responses:
        "200":
          description: Current punch state in Asia/Ulaanbaatar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceDeviceStatus" }
        "403":
          description: Request did not originate from the configured office network
  /attendance/device/punch:
    post:
      operationId: punchAttendanceDevice
      tags: [attendance]
      summary: Sign in or out with this registered device from the office network
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceDevicePunchInput" }
      responses:
        "200":
          description: Updated punch state; checkout also creates the attendance record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceDeviceStatus" }
        "403":
          description: Request did not originate from the configured office network
        "409":
          description: Duplicate, out-of-order, or conflicting attendance
  /payroll:
    get:
      operationId: getPayroll
      tags: [payroll]
      summary: Calculate payroll for a month
      parameters:
        - in: query
          name: month
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          required: false
      responses:
        "200":
          description: Payroll summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollSummary"
  /payroll-schedule:
    get:
      operationId: getPayrollSchedule
      tags: [payroll]
      summary: Get the global payroll cycle and payment schedule
      responses:
        "200":
          description: Payroll schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollSchedule" }
    put:
      operationId: updatePayrollSchedule
      tags: [payroll]
      summary: Update the global payroll cycle and payment schedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayrollScheduleInput" }
      responses:
        "200":
          description: Updated payroll schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollSchedule" }
  /payroll-adjustments:
    put:
      operationId: upsertPayrollAdjustment
      tags: [payroll]
      summary: Save monthly payroll adjustments for an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollAdjustmentInput"
      responses:
        "200":
          description: Saved payroll adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollAdjustment"
  /payroll-adjustments/{month}/{employeeId}/transactions/{sequence}:
    delete:
      operationId: deletePayrollAdjustmentTransaction
      tags: [payroll]
      summary: Delete one payroll payment transaction
      parameters:
        - in: path
          name: month
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - in: path
          name: employeeId
          required: true
          schema: { type: integer }
        - in: path
          name: sequence
          required: true
          schema: { type: integer, enum: [1, 2] }
      responses:
        "204":
          description: Payroll payment transaction deleted
  /payroll-advance:
    get:
      operationId: getPayrollAdvance
      tags: [payroll]
      summary: Get the monthly payroll advance list and approval status
      parameters:
        - in: query
          name: month
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          required: false
      responses:
        "200":
          description: Monthly payroll advance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollAdvanceSummary"
  /payroll-advance/approve:
    post:
      operationId: approvePayrollAdvance
      tags: [payroll]
      summary: Approve and freeze the monthly payroll advance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollAdvanceApprovalInput"
      responses:
        "200":
          description: Approved monthly payroll advance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollAdvanceSummary"
  /payroll-advance/approval:
    delete:
      operationId: revertPayrollAdvanceApproval
      tags: [payroll]
      summary: Revert a monthly payroll advance approval
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        "200":
          description: Recalculated unapproved monthly payroll advance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollAdvanceSummary"
  /payroll-advance/payment:
    put:
      operationId: updatePayrollAdvancePayment
      tags: [payroll]
      summary: Update an approved employee payroll advance amount and paid status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollAdvancePaymentInput"
      responses:
        "200":
          description: Updated monthly payroll advance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollAdvanceSummary"
  /hour-balance:
    get:
      operationId: getHourBalance
      tags: [hour-balance]
      summary: Get monthly hour balance
      parameters:
        - in: query
          name: month
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          required: false
      responses:
        "200":
          description: Monthly hour balance by employee
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HourBalanceLine"
  /cash/summary:
    get:
      operationId: getCashSummary
      tags: [cash]
      summary: Get cash summary
      responses:
        "200":
          description: Cash summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashSummary"
  /cash/transactions:
    get:
      operationId: listCashTransactions
      tags: [cash]
      summary: List cash transactions
      responses:
        "200":
          description: Cash transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CashTransaction"
    post:
      operationId: createCashTransaction
      tags: [cash]
      summary: Create a cash transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashTransactionInput"
      responses:
        "201":
          description: Created cash transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashTransaction"
  /cash/transactions/{id}:
    put:
      operationId: updateCashTransaction
      tags: [cash]
      summary: Update an open manual cash transaction
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashTransactionInput"
      responses:
        "200":
          description: Updated cash transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashTransaction"
    delete:
      operationId: deleteCashTransaction
      tags: [cash]
      summary: Delete an open manual cash transaction
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted cash transaction
  /cash/transactions/{id}/income-month:
    patch:
      operationId: updateBankCashTransactionIncomeMonth
      tags: [cash]
      summary: Update the income month of an open bank-originated cash income
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashIncomeMonthUpdate"
      responses:
        "200":
          description: Updated cash transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashTransaction"
  /cash/transactions/{id}/journal:
    post:
      operationId: postCashTransactionJournal
      tags: [cash]
      summary: Post a journal for an eligible cash transaction without one
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
