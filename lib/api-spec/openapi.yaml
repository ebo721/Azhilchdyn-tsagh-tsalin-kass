components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: integer
    JournalDateFrom:
      in: query
      name: dateFrom
      required: false
      schema:
        $ref: "#/components/schemas/JournalDate"
    JournalDateTo:
      in: query
      name: dateTo
      required: false
      schema:
        $ref: "#/components/schemas/JournalDate"
    JournalSourceType:
      in: query
      name: sourceType
      required: false
      schema:
        type: string
    JournalAccountId:
      in: query
      name: accountId
      required: false
      schema:
        type: integer
        minimum: 1
    JournalStatus:
      in: query
      name: status
      required: false
      schema:
        type: string
        enum: [draft, posted, void]
    MealCountsDateFrom:
      in: query
      name: dateFrom
      required: true
      schema: { $ref: "#/components/schemas/MealCountDate" }
    MealCountsDateTo:
      in: query
      name: dateTo
      required: true
      schema: { $ref: "#/components/schemas/MealCountDate" }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Operation conflicts with the current resource state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    JournalDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    JournalEntryLine:
      type: object
      required: [id, accountId, debit, credit, memo, allocation]
      properties:
        id: { type: integer }
        accountId: { type: integer }
        debit: { type: number, minimum: 0 }
        credit: { type: number, minimum: 0 }
        memo: { type: ["string", "null"] }
        allocation:
          oneOf:
            - $ref: "#/components/schemas/ReceivableCreateAllocation"
            - $ref: "#/components/schemas/ReceivableSettleAllocation"
            - $ref: "#/components/schemas/PayableSettleAllocation"
            - type: "null"
    JournalEntryLineInput:
      type: object
      required: [accountId, debit, credit]
      properties:
        accountId: { type: integer, minimum: 1 }
        debit: { type: number, minimum: 0 }
        credit: { type: number, minimum: 0 }
        memo: { type: ["string", "null"] }
        allocation:
          oneOf:
            - $ref: "#/components/schemas/ReceivableCreateAllocation"
            - $ref: "#/components/schemas/ReceivableSettleAllocation"
            - $ref: "#/components/schemas/PayableSettleAllocation"
            - type: "null"
    ReceivableCreateAllocation:
      type: object
      required: [kind, partyType]
      properties:
        kind: { type: string, enum: [create] }
        partyType: { type: string, enum: [employee, supplier] }
        employeeId: { type: integer, minimum: 1 }
        supplierId: { type: integer, minimum: 1 }
    ReceivableSettleAllocation:
      type: object
      required: [kind, receivableId]
      properties:
        kind: { type: string, enum: [settle] }
        receivableId: { type: integer, minimum: 1 }
    PayableSettleAllocation:
      type: object
      required: [kind, payableId]
      properties:
        kind: { type: string, enum: [settle] }
        payableId: { type: integer, minimum: 1 }
    JournalEntryInput:
      type: object
      required: [date, description, lines]
      properties:
        date: { $ref: "#/components/schemas/JournalDate" }
        description: { type: string, minLength: 1 }
        lines:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/JournalEntryLineInput" }
    JournalEntryUpdateInput:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/JournalEntryLineInput" }
    JournalEntrySummary:
      type: object
      required: [id, date, description, sourceType, sourceId, status, createdBy, createdAt, totalDebit, totalCredit]
      properties:
        id: { type: integer }
        date: { $ref: "#/components/schemas/JournalDate" }
        description: { type: string }
        sourceType: { type: string }
        sourceId: { type: ["integer", "null"] }
        status: { type: string, enum: [draft, posted, void] }
        createdBy: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
        totalDebit: { type: number }
        totalCredit: { type: number }
    JournalEntry:
      allOf:
        - $ref: "#/components/schemas/JournalEntrySummary"
        - type: object
          required: [lines, voidedAt, voidedBy]
          properties:
            lines:
              type: array
              items: { $ref: "#/components/schemas/JournalEntryLine" }
            voidedAt: { type: ["string", "null"], format: date-time }
            voidedBy: { type: ["integer", "null"] }
    JournalVoidResult:
      type: object
      required: [reversalEntryId]
      properties:
        reversalEntryId: { type: integer }
    JournalReceivable:
      type: object
      required: [id, originJournalEntryId, originJournalLineId, partyType, partyId, partyLabel, originalAmount, openAmount, status, createdAt]
      properties:
        id: { type: integer }
        originJournalEntryId: { type: integer }
        originJournalLineId: { type: integer }
        partyType: { type: string, enum: [employee, supplier] }
        partyId: { type: integer }
        partyLabel: { type: string }
        originalAmount: { type: number }
        openAmount: { type: number }
        status: { type: string, enum: [open, settled] }
        createdAt: { type: string, format: date-time }
    JournalPayable:
      type: object
      required: [id, journalEntryId, description, partyType, partyId, partyLabel, originalAmount, remainingBalance, status, createdAt]
      properties:
        id: { type: integer }
        journalEntryId: { type: integer }
        description: { type: string }
        partyType: { type: string, enum: [employee, supplier] }
        partyId: { type: integer }
        partyLabel: { type: string }
        originalAmount: { type: number }
        remainingBalance: { type: number }
        status: { type: string, enum: [open, closed] }
        createdAt: { type: string, format: date-time }
    JournalSupplier:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    JournalLedger:
      type: object
      required: [accountId, code, name, normalBalance, entries]
      properties:
        accountId: { type: integer }
        code: { type: string }
        name: { type: string }
        normalBalance: { type: string, enum: [debit, credit] }
        entries:
          type: array
          items: { $ref: "#/components/schemas/JournalLedgerEntry" }
    JournalLedgerEntry:
      type: object
      required: [date, journalEntryId, debit, credit, balance]
      properties:
        date: { $ref: "#/components/schemas/JournalDate" }
        journalEntryId: { type: integer }
        debit: { type: number }
        credit: { type: number }
        balance: { type: number }
    JournalTrialBalance:
      type: object
      required: [balanced, totalDebit, totalCredit, accounts]
      properties:
        balanced: { type: boolean }
        totalDebit: { type: number }
        totalCredit: { type: number }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/JournalTrialBalanceAccount" }
    JournalTrialBalanceAccount:
      type: object
      required: [accountId, code, name, normalBalance, debit, credit, balance]
      properties:
        accountId: { type: integer }
        code: { type: string }
        name: { type: string }
        normalBalance: { type: string, enum: [debit, credit] }
        debit: { type: number }
        credit: { type: number }
        balance: { type: number }
    AuthSession:
      type: object
      required: [authenticated, id, role, username]
      properties:
        authenticated: { type: boolean }
        id: { type: [integer, "null"] }
        role: { type: [string, "null"], enum: [admin, hr, accountant, warehouse, viewer, technologist, null] }
        username: { type: [string, "null"] }
    User:
      type: object
      required: [id, username, role]
      properties:
