        id: { type: integer }
        source: { type: string, enum: [bank, cash] }
        type: { type: string, enum: [income, expense] }
        description: { type: string }
        amount: { type: number }
        occurredAt: { type: string }
        account: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        unclearAt: { type: string, format: date-time }
    UnclearTransactionList:
      type: array
      items: { $ref: "#/components/schemas/UnclearTransaction" }
    BankTransactionCashTransferInput:
      type: object
