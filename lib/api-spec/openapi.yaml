components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: integer
    JournalDateFrom:
      in: query
      name: dateFrom
      required: false
      schema:
        $ref: "#/components/schemas/JournalDate"
    JournalDateTo:
      in: query
      name: dateTo
      required: false
      schema:
        $ref: "#/components/schemas/JournalDate"
    JournalSourceType:
      in: query
      name: sourceType
      required: false
      schema:
        type: string
    JournalAccountId:
      in: query
      name: accountId
      required: false
      schema:
        type: integer
        minimum: 1
    JournalStatus:
      in: query
      name: status
      required: false
      schema:
        type: string
        enum: [draft, posted, void]
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Operation conflicts with the current resource state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    JournalDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    JournalEntryLine:
      type: object
      required: [id, accountId, debit, credit, memo, allocation]
      properties:
        id: { type: integer }
        accountId: { type: integer }
        debit: { type: number, minimum: 0 }
        credit: { type: number, minimum: 0 }
        memo: { type: ["string", "null"] }
        allocation:
          oneOf:
            - $ref: "#/components/schemas/ReceivableCreateAllocation"
            - $ref: "#/components/schemas/ReceivableSettleAllocation"
            - type: "null"
    JournalEntryLineInput:
      type: object
      required: [accountId, debit, credit]
      properties:
        accountId: { type: integer, minimum: 1 }
        debit: { type: number, minimum: 0 }
        credit: { type: number, minimum: 0 }
        memo: { type: ["string", "null"] }
        allocation:
          oneOf:
            - $ref: "#/components/schemas/ReceivableCreateAllocation"
            - $ref: "#/components/schemas/ReceivableSettleAllocation"
            - type: "null"
    ReceivableCreateAllocation:
      type: object
      required: [kind, partyType]
      properties:
        kind: { type: string, enum: [create] }
        partyType: { type: string, enum: [employee, supplier] }
        employeeId: { type: integer, minimum: 1 }
        supplierId: { type: integer, minimum: 1 }
    ReceivableSettleAllocation:
      type: object
      required: [kind, receivableId]
      properties:
        kind: { type: string, enum: [settle] }
        receivableId: { type: integer, minimum: 1 }
    JournalEntryInput:
      type: object
      required: [date, description, lines]
      properties:
        date: { $ref: "#/components/schemas/JournalDate" }
        description: { type: string, minLength: 1 }
        lines:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/JournalEntryLineInput" }
    JournalEntryUpdateInput:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/JournalEntryLineInput" }
    JournalEntrySummary:
      type: object
      required: [id, date, description, sourceType, sourceId, status, createdBy, createdAt, totalDebit, totalCredit]
      properties:
        id: { type: integer }
        date: { $ref: "#/components/schemas/JournalDate" }
        description: { type: string }
        sourceType: { type: string }
        sourceId: { type: ["integer", "null"] }
        status: { type: string, enum: [draft, posted, void] }
        createdBy: { type: ["integer", "null"] }
