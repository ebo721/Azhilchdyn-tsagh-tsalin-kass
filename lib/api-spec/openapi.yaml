        id: { type: integer }
        bankName: { type: string }
        accountNumber: { type: string }
        createdAt: { type: string, format: date-time }
    BankAccountInput:
      type: object
      required: [bankName, accountNumber]
      properties:
        bankName: { type: string, minLength: 1, maxLength: 100 }
        accountNumber: { type: string, minLength: 1, maxLength: 100 }
    UnclearTransaction:
      type: object
      required: [id, source, type, description, amount, occurredAt, unclearAt]
