openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: auth
    description: HR manager authentication
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summaries
  - name: employees
    description: Employee management
  - name: attendance
    description: Attendance tracking
  - name: payroll
    description: Payroll calculations
  - name: hour-balance
    description: Monthly hour balances
  - name: cash
    description: Cash register transactions
paths:
  /auth/me:
    get:
      operationId: getAuthSession
      tags: [auth]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/login:
    post:
      operationId: loginHrManager
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/logout:
    post:
      operationId: logoutHrManager
      tags: [auth]
      responses:
        "204":
          description: Logged out
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
  /employees/{id}:
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete an employee
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Employee deleted
  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List attendance records
      parameters:
        - in: query
          name: date
          schema:
            type: string
          required: false
        - in: query
          name: month
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          required: false
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attendance"
    post:
      operationId: createAttendance
      tags: [attendance]
      summary: Create or replace attendance record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: Created attendance record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
    put:
      operationId: upsertAttendance
      tags: [attendance]
      summary: Mark an employee as present or absent for a day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceToggleInput"
      responses:
        "200":
          description: Updated attendance record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
    delete:
      operationId: deleteAttendance
      tags: [attendance]
      summary: Clear an employee attendance record for a day
      parameters:
        - in: query
          name: employeeId
          required: true
          schema:
            type: integer
        - in: query
          name: date
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Attendance record cleared
  /attendance/shifts:
    get:
      operationId: listShifts
      tags: [attendance]
      summary: List reusable shift schedules
      responses:
        "200":
          description: Shift schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shift"
    post:
      operationId: createShift
      tags: [attendance]
      summary: Create a shift schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftInput"
      responses:
        "201":
          description: Created shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
  /attendance/shifts/{id}:
    patch:
      operationId: updateShift
      tags: [attendance]
      summary: Update a shift schedule
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftInput"
      responses:
        "200":
          description: Updated shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
    delete:
      operationId: deleteShift
      tags: [attendance]
      summary: Delete an unused shift schedule
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Shift deleted
  /attendance/shift-plans:
    get:
      operationId: listShiftPlans
      tags: [attendance]
      summary: List employee shift plans for a month
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        "200":
          description: Monthly shift plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShiftPlan"
    put:
      operationId: upsertShiftPlan
      tags: [attendance]
      summary: Assign or clear an employee shift for a day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftPlanInput"
      responses:
        "200":
          description: Updated shift plan, or null when cleared
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ShiftPlan"
                  - type: "null"
  /attendance/shift-plans/copy-previous:
    post:
      operationId: copyPreviousShiftPlans
      tags: [attendance]
      summary: Copy valid active shift-employee plans from a selected month
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftPlanCopyInput"
      responses:
        "200":
          description: Shift plan copy result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftPlanCopyResult"
  /payroll:
    get:
      operationId: getPayroll
      tags: [payroll]
      summary: Calculate payroll for a month
      parameters:
        - in: query
          name: month
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          required: false
      responses:
        "200":
          description: Payroll summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollSummary"
  /payroll-adjustments:
    put:
      operationId: upsertPayrollAdjustment
      tags: [payroll]
      summary: Save monthly payroll adjustments for an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollAdjustmentInput"
      responses:
        "200":
          description: Saved payroll adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollAdjustment"
  /payroll-advance:
    get:
      operationId: getPayrollAdvance
      tags: [payroll]
      summary: Get the monthly payroll advance list and approval status
      parameters:
        - in: query
          name: month
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          required: false
      responses:
        "200":
          description: Monthly payroll advance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollAdvanceSummary"
  /payroll-advance/approve:
    post:
      operationId: approvePayrollAdvance
      tags: [payroll]
      summary: Approve and freeze the monthly payroll advance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollAdvanceApprovalInput"
      responses:
        "200":
          description: Approved monthly payroll advance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollAdvanceSummary"
  /payroll-advance/approval:
    delete:
      operationId: revertPayrollAdvanceApproval
      tags: [payroll]
      summary: Revert a monthly payroll advance approval
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        "200":
          description: Recalculated unapproved monthly payroll advance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollAdvanceSummary"
  /payroll-advance/payment:
    put:
      operationId: updatePayrollAdvancePayment
      tags: [payroll]
      summary: Mark an approved employee payroll advance as paid or unpaid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollAdvancePaymentInput"
      responses:
        "200":
          description: Updated monthly payroll advance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollAdvanceSummary"
  /hour-balance:
    get:
      operationId: getHourBalance
      tags: [hour-balance]
      summary: Get monthly hour balance
      parameters:
        - in: query
          name: month
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          required: false
      responses:
        "200":
          description: Monthly hour balance by employee
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HourBalanceLine"
  /cash/summary:
    get:
      operationId: getCashSummary
      tags: [cash]
      summary: Get cash summary
      responses:
        "200":
          description: Cash summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashSummary"
  /cash/transactions:
    get:
      operationId: listCashTransactions
      tags: [cash]
      summary: List cash transactions
      responses:
        "200":
          description: Cash transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CashTransaction"
    post:
      operationId: createCashTransaction
      tags: [cash]
      summary: Create a cash transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashTransactionInput"
      responses:
        "201":
          description: Created cash transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashTransaction"
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: integer
  schemas:
    AuthSession:
      type: object
      required: [authenticated, role, username]
      properties:
        authenticated: { type: boolean }
        role: { type: [string, "null"], enum: [admin, hr, accountant, null] }
        username: { type: [string, "null"] }
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Dashboard:
      type: object
      required: [employeeCount, presentToday, monthlyPayroll, cashBalance, recentActivity]
      properties:
        employeeCount: { type: integer }
        presentToday: { type: integer }
        monthlyPayroll: { type: number }
        cashBalance: { type: number }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    Activity:
      type: object
      required: [id, type, title, detail, createdAt]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        detail: { type: string }
        createdAt: { type: string }
    Employee:
      type: object
      required: [id, name, role, phone, employeeType, baseSalary, socialInsuranceSalary, payrollTaxExempt, monthlyExpectedWorkDays, status, joinedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string }
        phone: { type: string }
        employeeType: { type: string, enum: [shift, office] }
        baseSalary: { type: number }
        socialInsuranceSalary: { type: number }
        payrollTaxExempt: { type: boolean }
        monthlyExpectedWorkDays: { type: integer }
        status: { type: string, enum: [active, inactive] }
        joinedAt: { type: string }
    EmployeeInput:
      type: object
      required: [name, role, phone, employeeType, baseSalary, socialInsuranceSalary, payrollTaxExempt, monthlyExpectedWorkDays]
      properties:
        name: { type: string, minLength: 1 }
        role: { type: string, minLength: 1 }
        phone: { type: string }
        employeeType: { type: string, enum: [shift, office] }
        baseSalary: { type: number, minimum: 0 }
        socialInsuranceSalary: { type: number, minimum: 0 }
        payrollTaxExempt: { type: boolean }
        monthlyExpectedWorkDays: { type: integer, minimum: 0, maximum: 31 }
    EmployeeUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        role: { type: string, minLength: 1 }
        phone: { type: string }
        employeeType: { type: string, enum: [shift, office] }
        baseSalary: { type: number, minimum: 0 }
        socialInsuranceSalary: { type: number, minimum: 0 }
        payrollTaxExempt: { type: boolean }
        monthlyExpectedWorkDays: { type: integer, minimum: 0, maximum: 31 }
        status: { type: string, enum: [active, inactive] }
    Attendance:
      type: object
      required: [id, employeeId, employeeName, date, clockIn, clockOut, hours, status]
      properties:
        id: { type: integer }
        employeeId: { type: integer }
        employeeName: { type: string }
        date: { type: string }
        clockIn: { type: string }
        clockOut: { type: string }
        hours: { type: number }
        status: { type: string, enum: [present, late, leave, absent] }
    AttendanceInput:
      type: object
      required: [employeeId, date, clockIn, clockOut, status]
      properties:
        employeeId: { type: integer }
        date: { type: string }
        clockIn: { type: string }
        clockOut: { type: string }
        status: { type: string, enum: [present, late, leave, absent] }
    AttendanceToggleInput:
      type: object
      required: [employeeId, date, status]
      properties:
        employeeId: { type: integer }
        date: { type: string }
        status: { type: string, enum: [present, absent, leave] }
        clockIn: { type: string }
        clockOut: { type: string }
        hours: { type: number, minimum: 0 }
    Shift:
      type: object
      required: [id, name, startTime, endTime]
      properties:
        id: { type: integer }
        name: { type: string }
        startTime: { type: string }
        endTime: { type: string }
    ShiftInput:
      type: object
      required: [name, startTime, endTime]
      properties:
        name: { type: string, minLength: 1 }
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
    ShiftPlan:
      type: object
      required: [id, employeeId, employeeName, date, shiftId, shiftName, startTime, endTime]
      properties:
        id: { type: integer }
        employeeId: { type: integer }
        employeeName: { type: string }
        date: { type: string }
        shiftId: { type: integer }
        shiftName: { type: string }
        startTime: { type: string }
        endTime: { type: string }
    ShiftPlanInput:
      type: object
      required: [employeeId, date, shiftId]
      properties:
        employeeId: { type: integer }
        date:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
        shiftId: { type: ["integer", "null"] }
    ShiftPlanCopyInput:
      type: object
      required: [sourceMonth, month, overwrite]
      properties:
        sourceMonth: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        overwrite: { type: boolean }
    ShiftPlanCopyResult:
      type: object
      required: [sourceMonth, targetMonth, copied, overwritten, skipped, unavailableDates]
      properties:
        sourceMonth: { type: string }
        targetMonth: { type: string }
        copied: { type: integer }
        overwritten: { type: integer }
        skipped: { type: integer }
        unavailableDates: { type: integer }
    HourBalanceLine:
      type: object
      required: [employeeId, employeeName, role, month, totalHours, expectedWorkDays, workDays, eightHourDays, twelveHourDays, leaveDays]
      properties:
        employeeId: { type: integer }
        employeeName: { type: string }
        role: { type: string }
        month: { type: string }
        totalHours: { type: number }
        expectedWorkDays: { type: integer }
        workDays: { type: integer }
        eightHourDays: { type: integer }
        twelveHourDays: { type: integer }
        leaveDays: { type: integer }
    PayrollLine:
      type: object
      required: [employeeId, employeeName, role, employeeType, daysWorked, hours, gross, socialInsuranceSalary, socialInsurance, taxableIncome, calculatedIncomeTax, taxRelief, incomeTax, advanceAmount, manualDeduction, deductions, payable, paidAmount, paymentDate, remainingAmount, net]
      properties:
        employeeId: { type: integer }
        employeeName: { type: string }
        role: { type: string }
        employeeType: { type: string, enum: [shift, office] }
        daysWorked: { type: number }
        hours: { type: number }
        gross: { type: number }
        socialInsuranceSalary: { type: number }
        socialInsurance: { type: number }
        taxableIncome: { type: number }
        calculatedIncomeTax: { type: number }
        taxRelief: { type: number }
        incomeTax: { type: number }
        advanceAmount: { type: number }
        manualDeduction: { type: number }
        deductions: { type: number }
        payable: { type: number }
        paidAmount: { type: number }
        paymentDate: { type: ["string", "null"] }
        remainingAmount: { type: number }
        net: { type: number }
    PayrollAdjustment:
      type: object
      required: [employeeId, month, taxRelief, manualDeduction, paidAmount]
      properties:
        employeeId: { type: integer }
        month: { type: string }
        taxRelief: { type: number }
        manualDeduction: { type: number }
        paidAmount: { type: number }
        paymentDate: { type: ["string", "null"] }
    PayrollAdjustmentInput:
      type: object
      required: [employeeId, month, manualDeduction, paidAmount]
      properties:
        employeeId: { type: integer }
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        manualDeduction: { type: number, minimum: 0 }
        paidAmount: { type: number, minimum: 0 }
        paymentDate: { type: ["string", "null"] }
    PayrollSummary:
      type: object
      required: [month, totalGross, totalSocialInsurance, totalIncomeTax, totalDeductions, totalNet, lines]
      properties:
        month: { type: string }
        totalGross: { type: number }
        totalSocialInsurance: { type: number }
        totalIncomeTax: { type: number }
        totalDeductions: { type: number }
        totalNet: { type: number }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PayrollLine"
    PayrollAdvanceLine:
      type: object
      required: [employeeId, employeeName, employeeType, baseSalary, daysWorked, dailySalary, totalSalary, advanceAmount, paid]
      properties:
        employeeId: { type: integer }
        employeeName: { type: string }
        employeeType: { type: string, enum: [shift, office] }
        baseSalary: { type: number }
        daysWorked: { type: number }
        dailySalary: { type: number }
        totalSalary: { type: number }
        advanceAmount: { type: number }
        paid: { type: boolean }
        paymentDate: { type: ["string", "null"] }
    PayrollAdvanceSummary:
      type: object
      required: [month, approved, totalAmount, lines]
      properties:
        month: { type: string }
        approved: { type: boolean }
        approvedAt: { type: string }
        totalAmount: { type: number }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PayrollAdvanceLine"
    PayrollAdvanceApprovalInput:
      type: object
      required: [month]
      properties:
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
    PayrollAdvancePaymentInput:
      type: object
      required: [month, employeeId, paid]
      properties:
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        employeeId: { type: integer }
        paid: { type: boolean }
        paymentDate: { type: ["string", "null"] }
    CashTransaction:
      type: object
      required: [id, type, category, description, amount, date, createdAt]
      properties:
        id: { type: integer }
        type: { type: string, enum: [income, expense] }
        category: { type: string }
        description: { type: string }
        amount: { type: number }
        date: { type: string }
        createdAt: { type: string }
    CashTransactionInput:
      type: object
      required: [type, category, description, amount, date]
      properties:
        type: { type: string, enum: [income, expense] }
        category: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        amount: { type: number, minimum: 0 }
        date: { type: string }
    CashSummary:
      type: object
      required: [balance, income, expense, todayIncome, todayExpense]
      properties:
        balance: { type: number }
        income: { type: number }
        expense: { type: number }
        todayIncome: { type: number }
        todayExpense: { type: number }

