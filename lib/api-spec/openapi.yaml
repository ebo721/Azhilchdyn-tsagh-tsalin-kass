        type: { type: string, enum: [income, expense] }
        category: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        amount: { type: number, minimum: 0 }
        date: { type: string }
        incomeMonth: { type: ["string", "null"], pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
    CashIncomeMonthUpdate:
      type: object
      required: [incomeMonth]
      properties:
        incomeMonth: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
    CashClosure:
      type: object
      required: [id, date, closedAt]
      properties:
        id: { type: integer }
        date: { type: string }
        closedAt: { type: string }
    CashClosureInput:
      type: object
      required: [date]
      properties:
        date:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
    CashSummary:
      type: object
