        balance: { type: number }
        income: { type: number }
        expense: { type: number }
        todayIncome: { type: number }
        todayExpense: { type: number }
    BankTransaction:
      type: object
      required: [id, transactionAt, type, amount, account, counterparty, description, executedAt, balance, transferredAt, cashTransactionId, bankAccountId, bankName, bankAccountNumber, createdAt]
      properties:
        id: { type: integer }
        transactionAt: { type: string, format: date-time }
        type: { type: string, enum: [income, expense] }
        amount: { type: number }
        account: { type: string }
        counterparty: { type: string }
        description: { type: string }
        executedAt: { type: ["string", "null"], format: date-time }
        balance: { type: ["number", "null"] }
        transferredAt: { type: ["string", "null"], format: date-time }
        cashTransactionId: { type: ["integer", "null"] }
        bankAccountId: { type: ["integer", "null"] }
        bankName: { type: ["string", "null"] }
        bankAccountNumber: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    BankTransactionImportResult:
      type: object
      required: [imported, skippedDuplicate, skippedZero]
      properties:
        imported: { type: integer, minimum: 0 }
        skippedDuplicate: { type: integer, minimum: 0 }
        skippedZero: { type: integer, minimum: 0 }
    InventoryPurchaseItem:
      type: object
      required: [id, inventoryItemId, name, category, unit, quantity, unitPrice, totalAmount]
      properties:
        id: { type: integer }
        inventoryItemId: { type: integer }
        name: { type: string }
        category: { type: string }
        unit: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        totalAmount: { type: number }
    InventoryPurchase:
      type: object
      required: [id, supplierName, hasReceipt, date, totalAmount, paid, createdAt, editable, items]
      properties:
        id: { type: integer }
        supplierName: { type: string }
        hasReceipt: { type: boolean }
        date: { type: string }
        totalAmount: { type: number }
        paid: { type: boolean }
        paymentDate: { type: string, nullable: true }
        paymentAmount: { type: number, nullable: true }
        createdAt: { type: string }
        editable: { type: boolean }
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryPurchaseItem"
    InventoryPurchaseItemInput:
      type: object
      required: [name, category, unit, quantity, unitPrice]
      properties:
        inventoryItemId: { type: integer }
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        unit:
          type: string
          enum: [ширхэг, кг, грамм, литр, мл, метр, багц, хайрцаг]
        quantity: { type: number, exclusiveMinimum: 0 }
        unitPrice: { type: number, minimum: 0 }
    InventoryPurchaseInput:
      type: object
      required: [supplierName, hasReceipt, date, items]
      properties:
        supplierName: { type: string, minLength: 1 }
        hasReceipt: { type: boolean }
        date:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InventoryPurchaseItemInput"
    InventoryPurchasePaymentInput:
      type: object
      required: [date, amount]
      properties:
        date:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
        amount: { type: number, exclusiveMinimum: 0 }
        bankTransactionId: { type: ["integer", "null"] }
    InventoryPurchaseBankSuggestion:
      type: object
      required: [id, transactionAt, amount, description, score]
      properties:
        id: { type: integer }
        transactionAt: { type: string, format: date-time }
        amount: { type: number }
        description: { type: string }
        score: { type: number }
    InventorySupplierUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    InventorySupplierItem:
      type: object
      required: [name, unit, quantity, totalAmount]
      properties:
        name: { type: string }
        unit: { type: string }
        quantity: { type: number }
        totalAmount: { type: number }
    InventorySupplier:
      type: object
      required: [id, name, purchaseCount, totalAmount, items]
      properties:
        id: { type: integer }
        name: { type: string }
        purchaseCount: { type: integer }
        totalAmount: { type: number }
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventorySupplierItem"
    InventoryItem:
      type: object
      required: [id, name, category, unit, quantity, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        unit: { type: string }
        quantity: { type: number }
        createdAt: { type: string }
    InventoryItemUpdate:
      type: object
      required: [name, category]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
    InventoryIssue:
      type: object
      required: [id, inventoryItemId, itemName, unit, date, quantity, purpose, createdAt]
      properties:
        id: { type: integer }
        inventoryItemId: { type: integer }
        itemName: { type: string }
        unit: { type: string }
        date: { type: string }
        quantity: { type: number }
        purpose: { type: string }
        createdAt: { type: string }
    InventoryIssueInput:
      type: object
      required: [inventoryItemId, date, quantity, purpose]
      properties:
        inventoryItemId: { type: integer }
        date:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
        quantity: { type: number, exclusiveMinimum: 0 }
        purpose: { type: string, minLength: 1 }
    FixedAsset:
      type: object
      required: [id, name, unitPrice, quantity, totalAmount, date, purchased, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
        totalAmount: { type: number }
        date: { type: string }
        purchased: { type: boolean }
        createdAt: { type: string }
    FixedAssetInput:
      type: object
      required: [name, unitPrice, quantity, date, purchased]
      properties:
        name: { type: string, minLength: 1 }
        unitPrice: { type: number, minimum: 0 }
        quantity: { type: integer, minimum: 1 }
        date:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
        purchased: { type: boolean }
    DeletionRequest:
      type: object
      required: [id, targetPath, label, requesterRole, status, requestedAt]
      properties:
        id: { type: integer }
        targetPath: { type: string }
        label: { type: string }
        requesterRole: { type: string, enum: [admin, hr, accountant, warehouse] }
        status: { type: string, enum: [pending, executing, completed, failed, cancelled] }
        requestedAt: { type: string }
        approvedAt: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
    DeletionRequestInput:
      type: object
      required: [targetPath, label]
      properties:
        targetPath: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }

