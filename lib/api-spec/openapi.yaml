openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: auth
    description: HR manager authentication
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summaries
  - name: employees
    description: Employee management
  - name: attendance
    description: Attendance tracking
  - name: payroll
    description: Payroll calculations
  - name: hour-balance
    description: Monthly hour balances
  - name: cash
    description: Cash register transactions
  - name: bank-transactions
    description: Bank statement transactions
  - name: users
    description: Admin user management
paths:
  /auth/me:
    get:
      operationId: getAuthSession
      tags: [auth]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/login:
    post:
      operationId: loginHrManager
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/logout:
    post:
      operationId: logoutHrManager
      tags: [auth]
      responses:
        "204":
          description: Logged out
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (admin only)
      responses:
        "200":
          description: Users without password data
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
  /users/{id}:
    put:
      operationId: updateUser
      tags: [users]
      summary: Update username, role, or password (admin only)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdateInput" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin only)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: User deleted
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
  /employees/{id}:
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete an employee
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Employee deleted
  /employees/{id}/salary-history:
    get:
      operationId: listEmployeeSalaryHistory
      tags: [employees]
      summary: List an employee's salary history
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Salary history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeSalaryHistory"
  /employees/{id}/salary-history/{historyId}:
    patch:
      operationId: updateEmployeeSalaryHistory
      tags: [employees]
      summary: Correct a salary history entry
      parameters:
        - $ref: "#/components/parameters/Id"
        - in: path
          name: historyId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeSalaryHistoryUpdate"
      responses:
        "200":
          description: Updated salary history entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeSalaryHistory"
    delete:
      operationId: deleteEmployeeSalaryHistory
      tags: [employees]
      summary: Delete an incorrect salary history entry
      parameters:
        - $ref: "#/components/parameters/Id"
        - in: path
          name: historyId
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Salary history entry deleted
  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List attendance records
      parameters:
        - in: query
          name: date
          schema:
            type: string
          required: false
        - in: query
          name: month
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          required: false
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attendance"
    post:
      operationId: createAttendance
      tags: [attendance]
      summary: Create or replace attendance record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: Created attendance record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
    put:
      operationId: upsertAttendance
      tags: [attendance]
      summary: Mark an employee as present or absent for a day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceToggleInput"
      responses:
        "200":
          description: Updated attendance record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
    delete:
      operationId: deleteAttendance
      tags: [attendance]
      summary: Clear an employee attendance record for a day
      parameters:
        - in: query
          name: employeeId
          required: true
          schema:
            type: integer
        - in: query
          name: date
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Attendance record cleared
  /attendance/shifts:
    get:
      operationId: listShifts
      tags: [attendance]
      summary: List reusable shift schedules
      responses:
        "200":
          description: Shift schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shift"
    post:
      operationId: createShift
      tags: [attendance]
      summary: Create a shift schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftInput"
      responses:
        "201":
          description: Created shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
  /attendance/shifts/{id}:
    patch:
      operationId: updateShift
      tags: [attendance]
      summary: Update a shift schedule
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftInput"
      responses:
        "200":
          description: Updated shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
    delete:
      operationId: deleteShift
      tags: [attendance]
      summary: Delete an unused shift schedule
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Shift deleted
  /attendance/shift-plans:
    get:
      operationId: listShiftPlans
      tags: [attendance]
      summary: List employee shift plans for a month
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        "200":
          description: Monthly shift plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShiftPlan"
    put:
      operationId: upsertShiftPlan
      tags: [attendance]
      summary: Assign or clear an employee shift for a day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftPlanInput"
      responses:
        "200":
          description: Updated shift plan, or null when cleared
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ShiftPlan"
                  - type: "null"
  /attendance/shift-plans/copy-previous:
    post:
      operationId: copyPreviousShiftPlans
      tags: [attendance]
      summary: Copy valid active shift-employee plans from a selected month
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftPlanCopyInput"
      responses:
        "200":
          description: Shift plan copy result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftPlanCopyResult"
  /payroll:
    get:
      operationId: getPayroll
      tags: [payroll]
      summary: Calculate payroll for a month
      parameters:
        - in: query
          name: month
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          required: false
      responses:
        "200":
          description: Payroll summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollSummary"
  /payroll-adjustments:
    put:
      operationId: upsertPayrollAdjustment
      tags: [payroll]
      summary: Save monthly payroll adjustments for an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollAdjustmentInput"
      responses:
        "200":
          description: Saved payroll adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollAdjustment"
  /payroll-adjustments/{month}/{employeeId}/transactions/{sequence}:
    delete:
      operationId: deletePayrollAdjustmentTransaction
      tags: [payroll]
      summary: Delete one payroll payment transaction
      parameters:
        - in: path
          name: month
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - in: path
          name: employeeId
          required: true
          schema: { type: integer }
        - in: path
          name: sequence
          required: true
          schema: { type: integer, enum: [1, 2] }
      responses:
        "204":
          description: Payroll payment transaction deleted
  /payroll-advance:
    get:
      operationId: getPayrollAdvance
      tags: [payroll]
      summary: Get the monthly payroll advance list and approval status
      parameters:
        - in: query
          name: month
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          required: false
      responses:
        "200":
          description: Monthly payroll advance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollAdvanceSummary"
  /payroll-advance/approve:
    post:
      operationId: approvePayrollAdvance
      tags: [payroll]
      summary: Approve and freeze the monthly payroll advance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollAdvanceApprovalInput"
      responses:
        "200":
          description: Approved monthly payroll advance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollAdvanceSummary"
  /payroll-advance/approval:
    delete:
      operationId: revertPayrollAdvanceApproval
      tags: [payroll]
      summary: Revert a monthly payroll advance approval
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        "200":
          description: Recalculated unapproved monthly payroll advance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollAdvanceSummary"
  /payroll-advance/payment:
    put:
      operationId: updatePayrollAdvancePayment
      tags: [payroll]
      summary: Update an approved employee payroll advance amount and paid status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollAdvancePaymentInput"
      responses:
        "200":
          description: Updated monthly payroll advance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollAdvanceSummary"
  /hour-balance:
    get:
      operationId: getHourBalance
      tags: [hour-balance]
      summary: Get monthly hour balance
      parameters:
        - in: query
          name: month
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          required: false
      responses:
        "200":
          description: Monthly hour balance by employee
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HourBalanceLine"
  /cash/summary:
    get:
      operationId: getCashSummary
      tags: [cash]
      summary: Get cash summary
      responses:
        "200":
          description: Cash summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashSummary"
  /cash/transactions:
    get:
      operationId: listCashTransactions
      tags: [cash]
      summary: List cash transactions
      responses:
        "200":
          description: Cash transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CashTransaction"
    post:
      operationId: createCashTransaction
      tags: [cash]
      summary: Create a cash transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashTransactionInput"
      responses:
        "201":
          description: Created cash transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashTransaction"
  /cash/transactions/{id}:
    put:
      operationId: updateCashTransaction
      tags: [cash]
      summary: Update an open manual cash transaction
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashTransactionInput"
      responses:
        "200":
          description: Updated cash transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashTransaction"
    delete:
      operationId: deleteCashTransaction
      tags: [cash]
      summary: Delete an open manual cash transaction
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted cash transaction
  /cash/transactions/{id}/income-month:
    patch:
      operationId: updateBankCashTransactionIncomeMonth
      tags: [cash]
      summary: Update the income month of an open bank-originated cash income
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashIncomeMonthUpdate"
      responses:
        "200":
          description: Updated cash transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashTransaction"
  /cash/closures:
    get:
      operationId: listCashClosures
      tags: [cash]
      summary: List closed cash dates
      responses:
        "200":
          description: Closed cash dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CashClosure"
    post:
      operationId: closeCashDay
      tags: [cash]
      summary: Close a cash day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashClosureInput"
      responses:
        "201":
          description: Closed cash day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashClosure"
  /bank-transactions:
    get:
      operationId: listBankTransactions
      tags: [bank-transactions]
      summary: List imported bank transactions
      responses:
        "200":
          description: Bank transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BankTransaction" }
  /bank-accounts:
    get:
      operationId: listBankAccounts
      tags: [bank-transactions]
      summary: List configured bank accounts
      responses:
        "200":
          description: Bank accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BankAccount" }
    post:
      operationId: createBankAccount
      tags: [bank-transactions]
      summary: Configure a bank account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountInput" }
      responses:
        "201":
          description: Bank account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccount" }
  /bank-transactions/import:
    post:
      operationId: importKapitronBankTransactions
      tags: [bank-transactions]
      summary: Import a Kapitron XLSX statement
      parameters:
        - name: bankAccountId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Imported transaction counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransactionImportResult" }
  /bank-transactions/{id}/transfer-to-cash:
    post:
      operationId: transferBankTransactionToCash
      tags: [bank-transactions]
      summary: Create a verified cash transaction from a bank transaction
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankTransactionCashTransferInput" }
      responses:
        "200":
          description: Bank transaction linked to its created cash transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransaction" }
  /bank-transactions/{id}/cash-suggestions:
    get:
      operationId: listBankTransactionCashSuggestions
      tags: [bank-transactions]
      summary: List matching unlinked cash transactions for a bank transaction
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Ranked cash transaction suggestions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CashTransactionSuggestion" }
  /bank-transactions/{id}/link-cash:
    post:
      operationId: linkBankTransactionToCash
      tags: [bank-transactions]
      summary: Verify an existing cash transaction against a bank transaction
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankTransactionCashLinkInput" }
      responses:
        "200":
          description: Bank transaction linked to the existing cash transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransaction" }
  /bank-transactions/{id}:
    delete:
      operationId: deleteBankTransaction
      tags: [bank-transactions]
      summary: Delete an untransferred bank transaction
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /unclear-transactions:
    get:
      operationId: listUnclearTransactions
      tags: [transactions]
      summary: List transactions hidden as unclear
      responses:
        "200":
          description: Unclear bank and cash transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnclearTransactionList" }
  /unclear-transactions/{source}/{id}:
    post:
      operationId: markTransactionUnclear
      tags: [transactions]
      summary: Hide a bank or cash transaction as unclear
      parameters:
        - name: source
          in: path
          required: true
          schema: { type: string, enum: [bank, cash] }
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Transaction hidden
  /inventory/purchases:
    get:
      operationId: listInventoryPurchases
      tags: [inventory]
      summary: List inventory purchases
      responses:
        "200":
          description: Inventory purchases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryPurchase"
    post:
      operationId: createInventoryPurchase
      tags: [inventory]
      summary: Register a bulk inventory purchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryPurchaseInput"
      responses:
        "201":
          description: Created inventory purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPurchase"
  /inventory/purchases/{id}:
    put:
      operationId: updateInventoryPurchase
      tags: [inventory]
      summary: Update inventory purchase, stock and cash transaction
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryPurchaseInput"
      responses:
        "200":
          description: Updated inventory purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPurchase"
    delete:
      operationId: deleteInventoryPurchase
      tags: [inventory]
      summary: Delete inventory purchase, reverse stock and remove cash transaction
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted inventory purchase
  /inventory/purchases/{id}/payment:
    put:
      operationId: confirmInventoryPurchasePayment
      tags: [inventory]
      summary: Mark an inventory purchase as paid and create its cash expense
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryPurchasePaymentInput"
      responses:
        "200":
          description: Payment confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPurchase"
    delete:
      operationId: cancelInventoryPurchasePayment
      tags: [inventory]
      summary: Cancel an inventory purchase payment and remove its cash expense
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Payment cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPurchase"
  /inventory/purchases/{id}/payment-bank-suggestions:
    get:
      operationId: listInventoryPurchasePaymentBankSuggestions
      tags: [inventory]
      summary: Suggest unlinked bank expenses for an inventory purchase payment
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Ranked bank transaction suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryPurchaseBankSuggestion"
  /inventory/suppliers:
    get:
      operationId: listInventorySuppliers
      tags: [inventory]
      summary: List inventory suppliers with aggregated purchases
      responses:
        "200":
          description: Inventory suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventorySupplier"
  /inventory/suppliers/{id}:
    put:
      operationId: updateInventorySupplier
      tags: [inventory]
      summary: Rename an inventory supplier and its purchase history
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventorySupplierUpdate"
      responses:
        "200":
          description: Updated inventory supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySupplier"
    delete:
      operationId: deleteInventorySupplier
      tags: [inventory]
      summary: Remove a supplier from the supplier directory without deleting purchase history
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Supplier removed
  /inventory/items:
    get:
      operationId: listInventoryItems
      tags: [inventory]
      summary: List inventory catalog and stock
      responses:
        "200":
          description: Inventory catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
  /inventory/items/{id}:
    put:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update inventory item category
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemUpdate"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
  /inventory/issues:
    get:
      operationId: listInventoryIssues
      tags: [inventory]
      summary: List inventory issues
      responses:
        "200":
          description: Inventory issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryIssue"
    post:
      operationId: createInventoryIssue
      tags: [inventory]
      summary: Issue inventory stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryIssueInput"
      responses:
        "201":
          description: Created inventory issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryIssue"
  /inventory/issues/{id}:
    put:
      operationId: updateInventoryIssue
      tags: [inventory]
      summary: Update inventory issue and rebalance stock
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryIssueInput"
      responses:
        "200":
          description: Updated inventory issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryIssue"
    delete:
      operationId: deleteInventoryIssue
      tags: [inventory]
      summary: Delete inventory issue and restore stock
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted inventory issue
  /fixed-assets:
    get:
      operationId: listFixedAssets
      tags: [fixed-assets]
      summary: List equipment and fixed assets
      responses:
        "200":
          description: Fixed assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FixedAsset"
    post:
      operationId: createFixedAsset
      tags: [fixed-assets]
      summary: Register equipment or fixed asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixedAssetInput"
      responses:
        "201":
          description: Created fixed asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixedAsset"
  /fixed-assets/{id}:
    put:
      operationId: updateFixedAsset
      tags: [fixed-assets]
      summary: Update equipment or fixed asset and its linked cash transaction
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixedAssetInput"
      responses:
        "200":
          description: Updated fixed asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixedAsset"
    delete:
      operationId: deleteFixedAsset
      tags: [fixed-assets]
      summary: Delete equipment or fixed asset and its linked cash transaction
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted fixed asset
  /deletion-requests:
    get:
      operationId: listDeletionRequests
      tags: [deletion-requests]
      summary: List deletion approval requests
      responses:
        "200":
          description: Deletion requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeletionRequest"
    post:
      operationId: createDeletionRequest
      tags: [deletion-requests]
      summary: Queue an operation for admin deletion approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletionRequestInput"
      responses:
        "201":
          description: Queued deletion request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequest"
  /deletion-requests/{id}/approve:
    post:
      operationId: approveDeletionRequest
      tags: [deletion-requests]
      summary: Approve and execute a queued deletion
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Completed deletion request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequest"
  /deletion-requests/{id}/cancel:
    post:
      operationId: cancelDeletionRequest
      tags: [deletion-requests]
      summary: Cancel a queued deletion request
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Cancelled deletion request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequest"
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: integer
  schemas:
    AuthSession:
      type: object
      required: [authenticated, id, role, username]
      properties:
        authenticated: { type: boolean }
        id: { type: [integer, "null"] }
        role: { type: [string, "null"], enum: [admin, hr, accountant, warehouse, viewer, null] }
        username: { type: [string, "null"] }
    User:
      type: object
      required: [id, username, role]
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string, enum: [admin, hr, accountant, warehouse, viewer] }
    UserUpdateInput:
      type: object
      required: [username, role]
      properties:
        username: { type: string, minLength: 1 }
        role: { type: string, enum: [admin, hr, accountant, warehouse, viewer] }
        newPassword: { type: string, minLength: 1 }
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Dashboard:
      type: object
      required: [employeeCount, previousMonthSalesIncome, previousMonthPayrollExpense, previousMonthInventoryExpense, recentActivity]
      properties:
        employeeCount: { type: integer }
        previousMonthSalesIncome: { type: number }
        previousMonthPayrollExpense: { type: number }
        previousMonthInventoryExpense: { type: number }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    Activity:
      type: object
      required: [id, type, title, detail, createdAt]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        detail: { type: string }
        createdAt: { type: string }
    Employee:
      type: object
      required: [id, name, role, phone, employeeType, baseSalary, socialInsuranceSalary, payrollTaxExempt, monthlyExpectedWorkDays, status, joinedAt, inactiveAt]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string }
        phone: { type: string }
        employeeType: { type: string, enum: [shift, office] }
        baseSalary: { type: number }
        socialInsuranceSalary: { type: number }
        payrollTaxExempt: { type: boolean }
        monthlyExpectedWorkDays: { type: integer }
        status: { type: string, enum: [active, inactive] }
        joinedAt: { type: string }
        inactiveAt: { type: [string, "null"] }
    EmployeeSalaryHistory:
      type: object
      required: [id, employeeId, effectiveFrom, employeeType, baseSalary, socialInsuranceSalary, payrollTaxExempt, createdAt]
      properties:
        id: { type: integer }
        employeeId: { type: integer }
        effectiveFrom: { type: string }
        employeeType: { type: string, enum: [shift, office] }
        baseSalary: { type: number }
        socialInsuranceSalary: { type: number }
        payrollTaxExempt: { type: boolean }
        createdAt: { type: string }
    EmployeeSalaryHistoryUpdate:
      type: object
      required: [effectiveFrom, baseSalary, socialInsuranceSalary]
      properties:
        effectiveFrom: { type: string, format: date }
        baseSalary: { type: number, minimum: 0 }
        socialInsuranceSalary: { type: number, minimum: 0 }
    EmployeeInput:
      type: object
      required: [name, role, phone, employeeType, baseSalary, socialInsuranceSalary, payrollTaxExempt, monthlyExpectedWorkDays, joinedAt]
      properties:
        name: { type: string, minLength: 1 }
        role: { type: string, minLength: 1 }
        phone: { type: string }
        employeeType: { type: string, enum: [shift, office] }
        baseSalary: { type: number, minimum: 0 }
        socialInsuranceSalary: { type: number, minimum: 0 }
        payrollTaxExempt: { type: boolean }
        monthlyExpectedWorkDays: { type: integer, minimum: 0, maximum: 31 }
        joinedAt: { type: string, format: date }
    EmployeeUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        role: { type: string, minLength: 1 }
        phone: { type: string }
        employeeType: { type: string, enum: [shift, office] }
        baseSalary: { type: number, minimum: 0 }
        socialInsuranceSalary: { type: number, minimum: 0 }
        payrollTaxExempt: { type: boolean }
        monthlyExpectedWorkDays: { type: integer, minimum: 0, maximum: 31 }
        status: { type: string, enum: [active, inactive] }
        joinedAt: { type: string, format: date }
        inactiveAt: { type: [string, "null"] }
        salaryEffectiveDate: { type: string, format: date }
    Attendance:
      type: object
      required: [id, employeeId, employeeName, date, clockIn, clockOut, hours, status]
      properties:
        id: { type: integer }
        employeeId: { type: integer }
        employeeName: { type: string }
        date: { type: string }
        clockIn: { type: string }
        clockOut: { type: string }
        hours: { type: number }
        status: { type: string, enum: [present, late, leave, absent] }
    AttendanceInput:
      type: object
      required: [employeeId, date, clockIn, clockOut, status]
      properties:
        employeeId: { type: integer }
        date: { type: string }
        clockIn: { type: string }
        clockOut: { type: string }
        status: { type: string, enum: [present, late, leave, absent] }
    AttendanceToggleInput:
      type: object
      required: [employeeId, date, status]
      properties:
        employeeId: { type: integer }
        date: { type: string }
        status: { type: string, enum: [present, absent, leave] }
        clockIn: { type: string }
        clockOut: { type: string }
        hours: { type: number, minimum: 0 }
    Shift:
      type: object
      required: [id, name, startTime, endTime]
      properties:
        id: { type: integer }
        name: { type: string }
        startTime: { type: string }
        endTime: { type: string }
    ShiftInput:
      type: object
      required: [name, startTime, endTime]
      properties:
        name: { type: string, minLength: 1 }
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
    ShiftPlan:
      type: object
      required: [id, employeeId, employeeName, date, shiftId, shiftName, startTime, endTime]
      properties:
        id: { type: integer }
        employeeId: { type: integer }
        employeeName: { type: string }
        date: { type: string }
        shiftId: { type: integer }
        shiftName: { type: string }
        startTime: { type: string }
        endTime: { type: string }
    ShiftPlanInput:
      type: object
      required: [employeeId, date, shiftId]
      properties:
        employeeId: { type: integer }
        date:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
        shiftId: { type: ["integer", "null"] }
    ShiftPlanCopyInput:
      type: object
      required: [sourceMonth, month, overwrite]
      properties:
        sourceMonth: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        overwrite: { type: boolean }
    ShiftPlanCopyResult:
      type: object
      required: [sourceMonth, targetMonth, copied, overwritten, skipped, unavailableDates]
      properties:
        sourceMonth: { type: string }
        targetMonth: { type: string }
        copied: { type: integer }
        overwritten: { type: integer }
        skipped: { type: integer }
        unavailableDates: { type: integer }
    HourBalanceLine:
      type: object
      required: [employeeId, employeeName, role, month, totalHours, expectedWorkDays, workDays, eightHourDays, twelveHourDays, leaveDays]
      properties:
        employeeId: { type: integer }
        employeeName: { type: string }
        role: { type: string }
        month: { type: string }
        totalHours: { type: number }
        expectedWorkDays: { type: integer }
        workDays: { type: integer }
        eightHourDays: { type: integer }
        twelveHourDays: { type: integer }
        leaveDays: { type: integer }
    PayrollLine:
      type: object
      required: [employeeId, employeeName, role, employeeType, daysWorked, hours, gross, socialInsuranceSalary, socialInsurance, taxableIncome, calculatedIncomeTax, taxRelief, incomeTax, advanceAmount, manualDeduction, deductions, carryoverAmount, payable, paidAmount, paymentDate, secondPaidAmount, secondPaymentDate, remainingAmount, overpaidAmount, balanceAmount, net]
      properties:
        employeeId: { type: integer }
        employeeName: { type: string }
        role: { type: string }
        employeeType: { type: string, enum: [shift, office] }
        daysWorked: { type: number }
        hours: { type: number }
        gross: { type: number }
        socialInsuranceSalary: { type: number }
        socialInsurance: { type: number }
        taxableIncome: { type: number }
        calculatedIncomeTax: { type: number }
        taxRelief: { type: number }
        incomeTax: { type: number }
        advanceAmount: { type: number }
        manualDeduction: { type: number }
        deductions: { type: number }
        carryoverAmount: { type: number }
        payable: { type: number }
        paidAmount: { type: number }
        paymentDate: { type: ["string", "null"] }
        secondPaidAmount: { type: number }
        secondPaymentDate: { type: ["string", "null"] }
        remainingAmount: { type: number }
        overpaidAmount: { type: number }
        balanceAmount: { type: number }
        net: { type: number }
    PayrollAdjustment:
      type: object
      required: [employeeId, month, taxRelief, manualDeduction, paidAmount, secondPaidAmount]
      properties:
        employeeId: { type: integer }
        month: { type: string }
        taxRelief: { type: number }
        manualDeduction: { type: number }
        paidAmount: { type: number }
        paymentDate: { type: ["string", "null"] }
        secondPaidAmount: { type: number }
        secondPaymentDate: { type: ["string", "null"] }
    PayrollAdjustmentInput:
      type: object
      required: [employeeId, month, manualDeduction, paidAmount, secondPaidAmount]
      properties:
        employeeId: { type: integer }
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        manualDeduction: { type: number, minimum: 0 }
        paidAmount: { type: number, minimum: 0 }
        paymentDate: { type: ["string", "null"] }
        secondPaidAmount: { type: number, minimum: 0 }
        secondPaymentDate: { type: ["string", "null"] }
    PayrollSummary:
      type: object
      required: [month, totalGross, totalSocialInsurance, totalIncomeTax, totalDeductions, totalNet, lines]
      properties:
        month: { type: string }
        totalGross: { type: number }
        totalSocialInsurance: { type: number }
        totalIncomeTax: { type: number }
        totalDeductions: { type: number }
        totalNet: { type: number }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PayrollLine"
    PayrollAdvanceLine:
      type: object
      required: [employeeId, employeeName, employeeType, baseSalary, daysWorked, dailySalary, totalSalary, advanceAmount, paid]
      properties:
        employeeId: { type: integer }
        employeeName: { type: string }
        employeeType: { type: string, enum: [shift, office] }
        baseSalary: { type: number }
        daysWorked: { type: number }
        dailySalary: { type: number }
        totalSalary: { type: number }
        advanceAmount: { type: number }
        paid: { type: boolean }
        paymentDate: { type: ["string", "null"] }
    PayrollAdvanceSummary:
      type: object
      required: [month, approved, approvalDate, totalAmount, lines]
      properties:
        month: { type: string }
        approved: { type: boolean }
        approvalDate: { type: ["string", "null"] }
        approvedAt: { type: string }
        totalAmount: { type: number }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PayrollAdvanceLine"
    PayrollAdvanceApprovalInput:
      type: object
      required: [month, approvalDate]
      properties:
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        approvalDate: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$' }
    PayrollAdvancePaymentInput:
      type: object
      required: [month, employeeId, advanceAmount, paid]
      properties:
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        employeeId: { type: integer }
        advanceAmount: { type: number, minimum: 0 }
        paid: { type: boolean }
        paymentDate: { type: ["string", "null"] }
    CashTransaction:
      type: object
      required: [id, type, category, description, amount, date, incomeMonth, bankTransactionId, bankVerifiedAt, createdAt, editable, transactionKind]
      properties:
        id: { type: integer }
        type: { type: string, enum: [income, expense] }
        category: { type: string }
        description: { type: string }
        amount: { type: number }
        date: { type: string }
        incomeMonth: { type: ["string", "null"], pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        bankTransactionId: { type: ["integer", "null"] }
        bankVerifiedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string }
        editable: { type: boolean }
        transactionKind: { type: string, enum: [manual, payroll, payroll_advance, inventory_purchase, fixed_asset_purchase, bank_transaction] }
    BankAccount:
      type: object
      required: [id, bankName, accountNumber, createdAt]
