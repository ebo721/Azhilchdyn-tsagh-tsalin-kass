kind = "web"
previewPath = "/"
title = "Ажилчдын цаг, цалин, касс"
description = "Жижиг бизнесийн ажилчдын цагийн бүртгэл, цалингийн тооцоо, кассын орлого зарлагыг нэг дор удирдах дотоод ажиллагааны веб апп."
version = "1.0.0"
id = "artifacts/staff-ops"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26211

[services.development]
run = "pnpm --filter @workspace/staff-ops run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/staff-ops", "run", "build" ]
serve = "static"
publicDir = "artifacts/staff-ops/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26211"
BASE_PATH = "/"
